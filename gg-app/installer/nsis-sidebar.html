<!doctype html>
<!--
  Source for the NSIS Welcome/Finish sidebar (final BMP is 164×314; rendered
  here at 2× = 328×628 then downscaled for crispness).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 328px;
        height: 628px;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .panel {
        position: relative;
        width: 328px;
        height: 628px;
        overflow: hidden;
        background: linear-gradient(180deg, #2a0d0a 0%, #120706 42%, #0a0605 100%);
        color: #fff7f5;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .panel::before {
        content: "";
        position: absolute;
        width: 420px;
        height: 170px;
        top: 105px;
        border: 1px solid rgba(255, 122, 107, 0.12);
        border-radius: 50%;
        transform: rotate(-8deg);
      }
      .logo {
        margin-top: 96px;
        width: 190px;
        height: 190px;
        object-fit: contain;
        filter: drop-shadow(0 18px 34px rgba(239, 68, 68, 0.38));
        position: relative;
        z-index: 1;
      }
      .name {
        margin-top: 22px;
        font-size: 38px;
        font-weight: 750;
        letter-spacing: -0.03em;
        position: relative;
        z-index: 1;
      }
      .name .accent {
        color: #ff7a6b;
      }
      .tag {
        margin-top: 12px;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #e8b7af;
        position: relative;
        z-index: 1;
      }
      .rule {
        margin-top: 28px;
        width: 54px;
        height: 3px;
        border-radius: 2px;
        background: #ef4444;
        position: relative;
        z-index: 1;
      }
      .foot {
        position: absolute;
        bottom: 34px;
        font-size: 15px;
        font-weight: 600;
        color: #c69086;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <img class="logo" src="logo.png" alt="" />
      <div class="name"><span class="accent">Orca</span>Coder</div>
      <div class="tag">Pod Command Deck</div>
      <div class="rule"></div>
      <div class="foot">Built for Windows</div>
    </div>
  </body>
</html>
