<!doctype html>
<!--
  Source for the NSIS page header strip (final BMP is 150×57; rendered here at
  2× = 300×114 then downscaled). NSIS draws this top-right.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 300px;
        height: 114px;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .bar {
        width: 300px;
        height: 114px;
        background: linear-gradient(180deg, #2a0d0a 0%, #0a0605 100%);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 14px;
        padding: 0 20px;
        color: #fff7f5;
      }
      .name {
        font-size: 26px;
        font-weight: 750;
        letter-spacing: -0.03em;
        white-space: nowrap;
      }
      .name .accent {
        color: #ff7a6b;
      }
      .logo {
        width: 72px;
        height: 72px;
        object-fit: contain;
        filter: drop-shadow(0 8px 16px rgba(239, 68, 68, 0.38));
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <div class="name"><span class="accent">Orca</span>Coder</div>
      <img class="logo" src="logo.png" alt="" />
    </div>
  </body>
</html>
