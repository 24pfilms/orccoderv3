[package]
name = "gg-app"
version = "0.54.5"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gg_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` + `image-png` are NOT default tauri features: the first adds the
# macOS menu-bar status item, the second lets `Image::from_bytes` decode the PNG
# tray mark (icons/tray-mac.png).
tauri = { version = "2", features = [
  "macos-private-api",
  "tray-icon",
  "image-png",
] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
# OS-level Ctrl/Cmd+Shift+H so the minimize/restore-all toggle fires even when
# every window is minimized and nothing has focus (a webview keydown cannot).
tauri-plugin-global-shortcut = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls-tls is required for the HTTPS image-generation call. Everything else this app
# does with reqwest talks to its own sidecar over plain http://localhost, so the
# dependency previously had no TLS backend at all and every https:// request failed
# at the transport layer. rustls keeps it self-contained (no system OpenSSL).
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# Board Mode's sole native store. Exact and bundled so packaged Windows builds
# never depend on an unknown system SQLite; `backup` supports verified snapshots.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "backup"] }
sha2 = { version = "=0.11.0", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }

# Updater and single-instance plugins are desktop-only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-updater = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

