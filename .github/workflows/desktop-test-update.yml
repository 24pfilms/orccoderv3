name: Desktop isolated update test

on:
  push:
    branches: [test/updater-pipeline]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-isolated-update-test-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.15.0
  PNPM_VERSION: 10.28.2
  RUST_VERSION: 1.97.1

jobs:
  build-test-update:
    name: Build test-key NSIS update
    runs-on: windows-2025
    timeout-minutes: 60
    environment: desktop-test-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Validate isolated test profile
        shell: pwsh
        env:
          EXPECTED_PUBLIC_KEY: ${{ vars.TAURI_TEST_SIGNING_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content gg-app/src-tauri/tauri.test.conf.json -Raw | ConvertFrom-Json
          if ($config.productName -ne 'OrcaCoder Update Test') { throw 'test product name mismatch' }
          if ($config.version -notmatch '^0\.54\.[45]$') { throw 'test version must be 0.54.4 or 0.54.5' }
          if ($config.identifier -ne 'com.orcacoder.desktop.updater-test') { throw 'test identifier mismatch' }
          if ($config.bundle.targets.Count -ne 1 -or $config.bundle.targets[0] -ne 'nsis') { throw 'test profile must build only NSIS' }
          if ($config.bundle.createUpdaterArtifacts) { throw 'workflow applies the test signature after packaging' }
          if ($config.plugins.updater.endpoints.Count -ne 1 -or $config.plugins.updater.endpoints[0] -ne 'https://github.com/24pfilms/orcacoder-test-releases/releases/latest/download/latest.json') { throw 'test endpoint mismatch' }
          if (-not $env:EXPECTED_PUBLIC_KEY -or $config.plugins.updater.pubkey -ne $env:EXPECTED_PUBLIC_KEY) { throw 'test public key mismatch' }
          if ($config.plugins.updater.pubkey -match 'orcacoder-releases|gg-coder|ggcoder') { throw 'test trust root contains a production or upstream identifier' }
          "VERSION=$($config.version)" >> $env:GITHUB_ENV

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application and sidecar
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @kenkaiiii/gg-ai build
          pnpm --filter @kenkaiiii/gg-agent build
          pnpm --filter @kenkaiiii/ggcoder build
          pnpm --filter gg-app stage:node
          pnpm --filter gg-app bundle:sidecar
          node gg-app/scripts/smoke-sidecar.mjs
          pnpm check
          pnpm --filter gg-app test
          cargo test --locked --manifest-path gg-app/src-tauri/Cargo.toml
          pnpm --filter gg-app build

      - name: Build isolated unsigned NSIS package
        working-directory: gg-app
        run: pnpm tauri build --ci --bundles nsis --no-sign --config src-tauri/tauri.test.conf.json

      - name: Apply throwaway Tauri test signature
        working-directory: gg-app
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_TEST_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_TEST_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installer.Count -ne 1) { throw "expected one NSIS installer, found $($installer.Count)" }
          pnpm tauri signer sign $installer[0].FullName
          if (-not (Test-Path "$($installer[0].FullName).sig")) { throw 'test update signature was not created' }

      - name: Assemble isolated test release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory test-release | Out-Null
          $installer = @(Get-ChildItem gg-app/src-tauri/target/release/bundle/nsis/*-setup.exe)
          $publishedName = "OrcaCoder.Update.Test_$($env:VERSION)_x64-setup.exe"
          Copy-Item $installer[0].FullName "test-release/$publishedName"
          Copy-Item "$($installer[0].FullName).sig" "test-release/$publishedName.sig"
          $signature = (Get-Content "test-release/$publishedName.sig" -Raw).Trim()
          $tag = "test-desktop-v$env:VERSION"
          $url = "https://github.com/24pfilms/orcacoder-test-releases/releases/download/$tag/$publishedName"
          $manifest = [ordered]@{
            version = $env:VERSION
            notes = if ($env:VERSION -eq '0.54.1') { 'Isolated updater bootstrap.' } else { 'OrcaCoder just updated!' }
            pub_date = (Get-Date).ToUniversalTime().ToString('o')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{ signature = $signature; url = $url }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content test-release/latest.json -Encoding utf8NoBOM
          Set-Content test-release/source-sha.txt $env:GITHUB_SHA -NoNewline
          $checksums = Get-ChildItem test-release -File | Sort-Object Name | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" }
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'test-release/SHA256SUMS'),
            ($checksums -join "`n") + "`n",
            [Text.UTF8Encoding]::new($false)
          )

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: orcacoder-test-update-${{ env.VERSION }}-${{ github.sha }}
          path: test-release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
