name: CI

on:
  push:
    branches: [orca-main]
  pull_request:
    branches: [orca-main]

permissions:
  contents: read

# Cancel the superseded run when a branch gets rapid successive pushes/PR
# updates. Keyed on head_ref for PRs, run_id (never collides) for orca-main pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Windows is the supported desktop target. macOS is built here as an EARLY
# WARNING only: it compiles the app and runs the cross-platform checks, so
# breakage on macOS is found on the pull request that causes it rather than
# months later when Mac support is actually wanted. It does not sign, notarize,
# or produce anything installable, and no one is shipped a macOS build.
#
# The macOS leg deliberately stops before the packaged smoke test: that step
# builds an MSI, which is Windows-only. A macOS equivalent has not been written.
#
# Linux returns only when its platform work is explicitly resumed.
#
# We deliberately keep the gg-editor + gg-pixel packages out of the matrix
# for now — they have heavier native deps (sharp, transformers) that slow CI
# without buying us much for the framework's release-critical packages
# (gg-ai, gg-agent, ggcoder, gg-boss).

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
        node: [24.15.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `shell: bash` on EVERY multi-line step is load-bearing, not cosmetic.
      # On Windows the default shell is PowerShell, which does not abort a
      # multi-line script when an intermediate command exits non-zero — only the
      # LAST line decides the step's outcome. So `ggcoder test` failing was
      # silently swallowed by `gg-boss test` succeeding right after it, and the
      # Windows leg reported SUCCESS while 72 ggcoder tests were failing. Every
      # Windows bug this suite was supposed to catch shipped through that gap.
      # bash's `-e` (set by the runner) makes each line fail the step.
      - name: Build framework packages
        shell: bash
        run: |
          pnpm --filter @kenkaiiii/gg-ai build
          pnpm --filter @kenkaiiii/gg-agent build
          pnpm --filter @kenkaiiii/ggcoder build
          pnpm --filter @kenkaiiii/gg-boss build

      # Deterministic perf budgets (fx-pattern ratchet): bundle size + CLI
      # startup. Baseline lives in bench/baseline/sizes.json; intentional
      # growth re-baselines via `node bench/size-gate.mjs --update`.
      - name: Size + startup gates
        shell: bash
        run: |
          # --only: a positional arg is ignored by the script, which then checks
          # every artifact — including the sidecar this job never builds (that
          # one is gated in the `app` job, which bundles it).
          node bench/size-gate.mjs --only dist:ggcoder
          node bench/startup-gate.mjs

      - name: Typecheck
        shell: bash
        run: |
          pnpm --filter @kenkaiiii/gg-ai check
          pnpm --filter @kenkaiiii/gg-agent check
          pnpm --filter @kenkaiiii/ggcoder check
          pnpm --filter @kenkaiiii/gg-boss check

      - name: Test framework packages
        shell: bash
        run: |
          pnpm --filter @kenkaiiii/gg-ai test
          pnpm --filter @kenkaiiii/gg-agent test
          pnpm --filter @kenkaiiii/gg-boss test

      # Blocking on every OS, Windows included. This started as a 72-failure
      # Windows backlog that had been invisible because the default PowerShell
      # shell swallowed it (see above); it is now zero, so the leg is a real
      # gate again. Do NOT reintroduce continue-on-error to get a red build
      # green — a non-blocking Windows leg is how the original bugs shipped.
      - name: Test ggcoder
        shell: bash
        run: pnpm --filter @kenkaiiii/ggcoder test

      - name: ggboss CLI smoke (extra belt-and-braces)
        run: node packages/gg-boss/dist/cli.js --help
        shell: bash

  # Distribution-critical Windows job: stages the bundled Node runtime, boots
  # the sidecar, runs Rust path/window tests, and exercises an extracted MSI.
  app:
    name: app · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # 45 not 15: the Windows leg compiles the Tauri tree and builds/launches
    # an MSI (~12 min warm; the Rust compile is much slower cold-cache), and a
    # cold macOS Rust compile is slower still.
    timeout-minutes: 45
    strategy:
      # macOS must not be able to cancel the Windows leg. Windows is the
      # supported target; macOS is advance warning and is allowed to fail on its
      # own without hiding the result that matters.
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: 1.97.1

      # Both `cargo test` and the Windows packaged build compile the same large
      # Tauri dependency tree; without a cache the packaged smoke would rebuild
      # it from scratch on every run.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: gg-app/src-tauri

      - name: Install
        run: pnpm install --frozen-lockfile

      # shell: bash for the same reason as the `test` job — on Windows a
      # PowerShell multi-line step only reports the LAST line's exit code, so a
      # failing build here would pass silently.
      - name: Build framework packages
        shell: bash
        run: |
          pnpm --filter @kenkaiiii/gg-ai build
          pnpm --filter @kenkaiiii/gg-agent build
          pnpm --filter @kenkaiiii/ggcoder build

      - name: Stage node runtime + bundle sidecar
        run: |
          pnpm --filter gg-app stage:node
          pnpm --filter gg-app bundle:sidecar
        shell: bash

      - name: Sidecar smoke (bundled runtime + bundle, per-OS)
        run: node gg-app/scripts/smoke-sidecar.mjs
        shell: bash

      # OS-independent slice of the sidecar bundle (app-sidecar.mjs + skills).
      - name: Sidecar size gate
        run: node bench/size-gate.mjs --only sidecar
        shell: bash

      - name: Frontend platform-class test
        run: pnpm --filter gg-app test

      - name: Rust unit tests (path + window-chrome resolution)
        working-directory: gg-app/src-tauri
        run: cargo test

      # Builds an MSI, extracts it without installing, launches it with a
      # throwaway profile, and requires a visible window plus packaged sidecar.
      # Windows-only: the script builds an MSI. There is no macOS equivalent yet.
      - name: Packaged app smoke (MSI build + launch)
        if: runner.os == 'Windows'
        working-directory: gg-app
        run: pnpm smoke:packaged

      # macOS: prove the app still COMPILES and bundles. `--bundles app` stops at
      # the .app and skips the DMG, which is the slow, flaky part and proves
      # nothing extra about the code.
      #
      # Unsigned on purpose. Signing needs an Apple Developer certificate, and a
      # secret must never be exposed to a pull request from a fork. This job
      # answers one question — does it build — and the .app is discarded.
      - name: macOS app build (compile check, unsigned)
        if: runner.os == 'macOS'
        working-directory: gg-app
        run: pnpm tauri build --bundles app
