name: Desktop candidate

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA on orca-main
        required: true
        type: string
      version:
        description: Exact SemVer without a tag prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-candidate-${{ inputs.commit_sha }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.15.0
  PNPM_VERSION: 10.28.2
  RUST_VERSION: 1.97.1

jobs:
  candidate:
    name: Windows x64 candidate
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove source authority
        shell: bash
        env:
          APPROVED_SHA: ${{ inputs.commit_sha }}
          APPROVED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          git fetch --no-tags origin orca-main
          git merge-base --is-ancestor "$APPROVED_SHA" origin/orca-main
          test -z "$(git status --porcelain)"

      - name: Verify release identity and version sources
        shell: pwsh
        env:
          APPROVED_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content gg-app/package.json -Raw | ConvertFrom-Json
          $tauri = Get-Content gg-app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $cargoText = Get-Content gg-app/src-tauri/Cargo.toml -Raw
          $lockText = Get-Content gg-app/src-tauri/Cargo.lock -Raw
          $cargoVersion = [regex]::Match($cargoText, '(?m)^version = "([0-9]+\.[0-9]+\.[0-9]+)"').Groups[1].Value
          $lockVersion = [regex]::Match($lockText, '(?m)^name = "gg-app"\r?\nversion = "([0-9]+\.[0-9]+\.[0-9]+)"').Groups[1].Value
          $versions = @($package.version, $tauri.version, $cargoVersion, $lockVersion)
          if ($versions -contains '' -or @($versions | Select-Object -Unique).Count -ne 1 -or $versions[0] -ne $env:APPROVED_VERSION) {
            throw "version mismatch: approved=$env:APPROVED_VERSION package=$($versions[0]) tauri=$($versions[1]) cargo=$($versions[2]) lock=$($versions[3])"
          }
          if ($tauri.productName -ne 'OrcaCoder' -or $tauri.identifier -ne 'com.orcacoder.desktop') { throw 'desktop product identity mismatch' }
          if (@($tauri.bundle.targets).Count -ne 1 -or $tauri.bundle.targets[0] -ne 'nsis') { throw 'Windows release must target NSIS only' }
          if ($tauri.bundle.createUpdaterArtifacts) { throw 'candidate source config must keep updater artifacts disabled' }
          if ($tauri.plugins.updater.endpoints.Count -ne 0 -or $tauri.plugins.updater.pubkey) { throw 'candidate source config must keep the production updater disabled' }

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: gg-app/src-tauri

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned SBOM generator
        run: dotnet tool install --global Microsoft.Sbom.DotNetTool --version 4.1.5

      - name: Build and verify
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @kenkaiiii/gg-ai build
          pnpm --filter @kenkaiiii/gg-agent build
          pnpm --filter @kenkaiiii/ggcoder build
          pnpm check
          pnpm lint
          pnpm test
          cargo test --locked --manifest-path gg-app/src-tauri/Cargo.toml
          pnpm --filter gg-app stage:node
          pnpm --filter gg-app bundle:sidecar
          node gg-app/scripts/smoke-sidecar.mjs

      - name: Build unsigned NSIS candidate
        working-directory: gg-app
        run: pnpm tauri build --ci --bundles nsis --no-sign

      - name: Assemble candidate evidence
        shell: pwsh
        env:
          APPROVED_SHA: ${{ inputs.commit_sha }}
          APPROVED_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory candidate | Out-Null
          Set-Content candidate/source-sha.txt $env:APPROVED_SHA -NoNewline
          Set-Content candidate/version.txt $env:APPROVED_VERSION -NoNewline
          Copy-Item gg-app/src-tauri/target/release/gg-app.exe candidate/gg-app.exe
          Copy-Item gg-app/src-tauri/binaries/ggnode-x86_64-pc-windows-msvc.exe candidate/ggnode-x86_64-pc-windows-msvc.exe
          Copy-Item gg-app/src-tauri/resources/sidecar candidate/sidecar -Recurse
          Copy-Item gg-app/src-tauri/target/release/bundle/nsis/*-setup.exe candidate/
          Copy-Item pnpm-lock.yaml,gg-app/src-tauri/Cargo.lock candidate/
          cargo metadata --locked --format-version 1 --manifest-path gg-app/src-tauri/Cargo.toml | Set-Content candidate/cargo-metadata.json
          pnpm list --recursive --json --depth Infinity | Set-Content candidate/pnpm-dependencies.json
          sbom-tool generate -b candidate -bc . -pn OrcaCoder -pv $env:APPROVED_VERSION -ps 24pfilms -nsb https://github.com/24pfilms/orcacoder-releases
          Copy-Item candidate/_manifest/spdx_2.2/manifest.spdx.json candidate/OrcaCoder.spdx.json
          Remove-Item candidate/_manifest -Recurse -Force
          Get-ChildItem candidate -File -Recurse | Sort-Object FullName | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetRelativePath((Resolve-Path candidate), $_.Path).Replace('\','/'))" } |
            Set-Content candidate/SHA256SUMS
          Get-ChildItem candidate -File | ForEach-Object { $_.Name }

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-candidate-${{ inputs.version }}-${{ inputs.commit_sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
