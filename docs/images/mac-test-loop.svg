<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="760" fill="#0f1115"/>

  <text x="50" y="54" fill="#f4f6f8" font-size="26" font-weight="600">Testing a Mac build without owning a Mac</text>
  <text x="50" y="82" fill="#9aa3b2" font-size="15">A Mac app can only be built on a Mac. You rent both, by the minute and by the hour.</text>

  <!-- The wrong assumption, corrected -->
  <rect x="50" y="106" width="900" height="72" rx="10" fill="#1d1416" stroke="#5c2b2e"/>
  <text x="72" y="134" fill="#f2716e" font-size="14" font-weight="600">This part cannot work:</text>
  <text x="72" y="158" fill="#c3c9d4" font-size="14">Building the Mac version on your Windows PC. It needs Apple's own tools, which do not exist on Windows.</text>

  <!-- Step 1 -->
  <rect x="50" y="204" width="435" height="150" rx="12" fill="#161922" stroke="#2f4b3f"/>
  <rect x="50" y="204" width="6" height="150" rx="3" fill="#36c489"/>
  <circle cx="92" cy="240" r="16" fill="#1a2b24"/>
  <text x="92" y="246" fill="#36c489" font-size="14" text-anchor="middle">1</text>
  <text x="122" y="246" fill="#f4f6f8" font-size="17" font-weight="600">GitHub builds it</text>
  <text x="72" y="278" fill="#9aa3b2" font-size="13.5">GitHub rents Apple computers by the minute and</text>
  <text x="72" y="298" fill="#9aa3b2" font-size="13.5">already has Apple's tools installed. Every pull</text>
  <text x="72" y="318" fill="#9aa3b2" font-size="13.5">request builds the Mac version on one of them.</text>
  <text x="72" y="342" fill="#36c489" font-size="12.5" font-weight="600">HAPPENS ON ITS OWN · YOU DO NOTHING</text>

  <!-- Step 2 -->
  <rect x="515" y="204" width="435" height="150" rx="12" fill="#141b26" stroke="#2b4463"/>
  <rect x="515" y="204" width="6" height="150" rx="3" fill="#4d9dff"/>
  <circle cx="557" cy="240" r="16" fill="#18243a"/>
  <text x="557" y="246" fill="#4d9dff" font-size="14" text-anchor="middle">2</text>
  <text x="587" y="246" fill="#f4f6f8" font-size="17" font-weight="600">You rent a Mac for an hour</text>
  <text x="537" y="278" fill="#9aa3b2" font-size="13.5">A cloud Mac you connect to like a remote screen.</text>
  <text x="537" y="298" fill="#9aa3b2" font-size="13.5">Rent it when you need it, give it back after.</text>
  <text x="537" y="318" fill="#9aa3b2" font-size="13.5">There is no need to buy one.</text>
  <text x="537" y="342" fill="#4d9dff" font-size="12.5" font-weight="600">YOU START IT</text>

  <!-- Step 3 -->
  <rect x="50" y="384" width="435" height="150" rx="12" fill="#141b26" stroke="#2b4463"/>
  <rect x="50" y="384" width="6" height="150" rx="3" fill="#4d9dff"/>
  <circle cx="92" cy="420" r="16" fill="#18243a"/>
  <text x="92" y="426" fill="#4d9dff" font-size="14" text-anchor="middle">3</text>
  <text x="122" y="426" fill="#f4f6f8" font-size="17" font-weight="600">Download it on that Mac</text>
  <text x="72" y="458" fill="#9aa3b2" font-size="13.5">Open GitHub in the rented Mac's own browser and</text>
  <text x="72" y="478" fill="#9aa3b2" font-size="13.5">download the build from the run that made it.</text>
  <text x="72" y="498" fill="#9aa3b2" font-size="13.5">Do not download it on your PC and send it over.</text>
  <text x="72" y="522" fill="#4d9dff" font-size="12.5" font-weight="600">YOU START IT</text>

  <!-- Step 4 -->
  <rect x="515" y="384" width="435" height="150" rx="12" fill="#1d1a12" stroke="#6b5320"/>
  <rect x="515" y="384" width="6" height="150" rx="3" fill="#e3a23f"/>
  <circle cx="557" cy="420" r="16" fill="#2a2415"/>
  <text x="557" y="426" fill="#e3a23f" font-size="14" text-anchor="middle">4</text>
  <text x="587" y="426" fill="#f4f6f8" font-size="17" font-weight="600">Right-click, then Open</text>
  <text x="537" y="458" fill="#c9b07a" font-size="13.5">The build is unsigned, so a double-click is refused.</text>
  <text x="537" y="478" fill="#c9b07a" font-size="13.5">Right-click the app and choose Open instead: that</text>
  <text x="537" y="498" fill="#c9b07a" font-size="13.5">offers a way through, and a double-click does not.</text>
  <text x="537" y="522" fill="#e3a23f" font-size="12.5" font-weight="600">EXPECT THIS · IT IS NOT A FAULT</text>

  <!-- Step 5 -->
  <rect x="50" y="564" width="900" height="112" rx="12" fill="#141b26" stroke="#2b4463"/>
  <rect x="50" y="564" width="6" height="112" rx="3" fill="#4d9dff"/>
  <circle cx="92" cy="600" r="16" fill="#18243a"/>
  <text x="92" y="606" fill="#4d9dff" font-size="14" text-anchor="middle">5</text>
  <text x="122" y="606" fill="#f4f6f8" font-size="17" font-weight="600">Test it, then give the Mac back</text>
  <text x="72" y="638" fill="#9aa3b2" font-size="13.5">GitHub's build proves the code compiles. Only a real Mac shows you whether the window looks right and the</text>
  <text x="72" y="658" fill="#9aa3b2" font-size="13.5">app behaves. Stop the rental when you are done — you only pay for the time you use.</text>

  <!-- flow arrows -->
  <g stroke="#3a4150" stroke-width="2" fill="none">
    <path d="M485 279 L515 279"/>
    <path d="M267 354 L267 384"/>
    <path d="M485 459 L515 459"/>
    <path d="M732 534 L732 564"/>
  </g>

  <text x="50" y="722" fill="#5b6472" font-size="13">Before anyone else can open a Mac build, it has to be signed. That needs an Apple Developer account, which is a yearly fee.</text>
</svg>
